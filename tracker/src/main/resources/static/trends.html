<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // INSTANT AUTH GUARD
        if (!localStorage.getItem("user")) {
            window.location.replace("login.html");
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Trends | Budget Advisor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #toast-container { position: fixed; top: 25px; right: 25px; z-index: 9999; }
        
        /* FIX FOR TOP NAV ALIGNMENT */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            height: 70px;
        }

        /* FIX FOR MASSIVE PROFILE PICTURE */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .user-avatar {
            width: 45px !important;
            height: 45px !important;
            border-radius: 50%;
            overflow: hidden; /* This crops the image into a circle */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary);
            flex-shrink: 0; /* Prevents it from being squished */
            background: #eee;
        }

        #user-header-pic {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the photo fills the circle without stretching */
        }

        /* CHART LAYOUT */
        .chart-wrapper { position: relative; height: 320px; width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        
        @media (max-width: 900px) { 
            .grid-2 { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body class="dashboard-body">

    <div id="toast-container"></div>

    <div class="dashboard-wrapper animate-slide-up">
        
        <!-- TOP NAVIGATION -->
        <nav class="top-nav">
            <div class="brand">
                <a href="dashboard.html" style="text-decoration:none; color:var(--navy); display: flex; align-items: center; gap: 10px; font-weight: 600;">
                    <i class="fas fa-arrow-left" style="color:var(--primary);"></i>
                    <span>Back to <b>Dashboard</b></span>
                </a>
            </div>

            <div class="user-profile" onclick="location.href='profile.html'">
                <div class="user-text" style="text-align: right;">
                    <span class="hey" style="font-size: 11px; color: #888; display: block;">Analytics for</span>
                    <span class="user-name" id="user-name-display" style="font-weight: 700; color: var(--navy);">User</span>
                </div>
                <div class="user-avatar">
                    <img id="user-header-pic" src="" alt="Profile" style="display:none;">
                    <i id="default-icon" class="fas fa-user-circle" style="font-size: 35px; color: var(--navy);"></i>
                </div>
            </div>
        </nav>

        <main class="main-content">
            
            <!-- 1. MONTHLY SPENDING TREND (LINE) -->
            <section class="card-section">
                <div class="card-header">
                    <h3><i class="fas fa-chart-line"></i> Monthly Spending Trend</h3>
                    <p style="font-size: 12px; color: #888;">Real-time tracking of expenses across time</p>
                </div>
                <div class="chart-wrapper" id="trend-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </section>

            <div class="grid-2">
                <!-- 2. INCOME VS EXPENSE (DOUGHNUT) -->
                <section class="card-section">
                    <div class="card-header">
                        <h3><i class="fas fa-balance-scale"></i> Income vs Expenses</h3>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="incomeVsExpenseChart"></canvas>
                    </div>
                </section>

                <!-- 3. CATEGORY BREAKDOWN (BAR) -->
                <section class="card-section">
                    <div class="card-header">
                        <h3><i class="fas fa-tags"></i> Spending by Category</h3>
                    </div>
                    <div class="chart-wrapper" id="category-container">
                        <canvas id="categoryBarChart"></canvas>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <script>
        const activeUser = JSON.parse(localStorage.getItem("user"));
        
        // Populate User Info
        document.getElementById("user-name-display").innerText = activeUser.fullName;
        if (activeUser.profilePic) {
            const img = document.getElementById("user-header-pic");
            img.src = activeUser.profilePic;
            img.style.display = "block";
            document.getElementById("default-icon").style.display = "none";
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        async function initCharts() {
            const userId = activeUser.id;

            try {
                // --- 1. LINE CHART ---
                const trendRes = await fetch(`/api/analysis/spending-trend/${userId}`);
                const trendData = await trendRes.json();

                if (trendData && trendData.length > 0) {
                    const ctxLine = document.getElementById('lineChart').getContext('2d');
                    const grad = ctxLine.createLinearGradient(0, 0, 0, 300);
                    grad.addColorStop(0, 'rgba(233, 196, 106, 0.3)');
                    grad.addColorStop(1, 'rgba(233, 196, 106, 0.0)');

                    new Chart(ctxLine, {
                        type: 'line',
                        data: {
                            labels: trendData.map(d => d.month),
                            datasets: [{
                                label: 'Spent', data: trendData.map(d => d.amount),
                                borderColor: '#E9C46A', backgroundColor: grad, fill: true,
                                tension: 0.4, pointRadius: 5, borderWidth: 3
                            }]
                        },
                        options: { 
                            responsive: true, maintainAspectRatio: false,
                            scales: { y: { ticks: { callback: v => '₹' + v } } }
                        }
                    });
                } else {
                    document.getElementById('trend-container').innerHTML = `<p style="text-align:center; padding-top:100px; color:#aaa;">Add data for different months to see trends.</p>`;
                }

                // --- 2. DOUGHNUT CHART ---
                const totalRes = await fetch(`/api/analysis/income-vs-expense/${userId}`);
                const totals = await totalRes.json();

                new Chart(document.getElementById('incomeVsExpenseChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Income', 'Expenses'],
                        datasets: [{
                            data: [totals.income || 0, totals.expense || 0],
                            backgroundColor: ['#2a9d8f', '#e76f51'],
                            borderWidth: 0, hoverOffset: 15
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });

                // --- 3. CATEGORY BAR CHART ---
                const catRes = await fetch(`/api/analysis/budget-vs-spent/${userId}`);
                const catData = await catRes.json();

                if (catData && catData.length > 0) {
                    new Chart(document.getElementById('categoryBarChart'), {
                        type: 'bar',
                        data: {
                            labels: catData.map(d => d.category),
                            datasets: [{
                                label: 'Spent (₹)',
                                data: catData.map(d => d.actualSpent),
                                backgroundColor: '#264653', borderRadius: 8
                            }]
                        },
                        options: { 
                            responsive: true, maintainAspectRatio: false,
                            indexAxis: 'y'
                        }
                    });
                } else {
                    document.getElementById('category-container').innerHTML = `<p style="text-align:center; padding-top:100px; color:#aaa;">No categorical data available.</p>`;
                }

            } catch (err) {
                console.error(err);
                showToast("Data sync error.", "error");
            }
        }

        window.onload = initCharts;
    </script>
    <script src="ai-agent.js"></script>
</body>
</html>
